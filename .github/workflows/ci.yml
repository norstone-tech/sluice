name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # required by nix-community/cache-nix-action to purge old caches

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: nix-shell --run "cargo test"

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-clippy-${{ runner.os }}-

      - run: nix-shell --run "cargo clippy --workspace --all-features --all-targets -- -D warnings"

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - run: nix-shell --run "cargo fmt --all -- --check"

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - run: nix-shell --run "nixfmt --check *.nix nix/*/*.nix"

      - name: Build the sluice package derivation
        run: nix-build -A packages.sluice --no-out-link

      - name: Evaluate the NixOS module
        # Exercises both `proxyMap` value forms: a bare address string, and the per-protocol
        # attribute set. The latter is only expressible since `proxyMap` stopped being
        # `attrsOf str`, so evaluating just the flat form would not catch a regression there.
        run: |
          nix-instantiate --eval --strict -E '
            let
              nixos = import <nixpkgs/nixos> {
                configuration = { pkgs, ... }: {
                  imports = [ ./nix/modules/sluice.nix ];
                  services.sluice = {
                    enable = true;
                    proxyMap."example.com" = "10.0.0.5:25";
                    proxyMap."example.org" = {
                      smtp = "10.0.0.6:25";
                      smtp_authenticated = "10.0.0.6:587";
                      imap = "10.0.0.6:143";
                    };
                  };
                  boot.loader.grub.enable = false;
                  boot.loader.systemd-boot.enable = false;
                  fileSystems."/".device = "/dev/null";
                  fileSystems."/".fsType = "ext4";
                  system.stateVersion = "26.05";
                };
              };
            in builtins.seq nixos.config.systemd.services.sluice.serviceConfig.ExecStart "module eval OK"
          '
